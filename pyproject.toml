[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-mesa-de-som"
version = "0.2.0"
description = "Mesa de som virtual acessível com efeitos de voz em tempo real."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Markdown>=3.7,<4",
    "numpy>=2,<3",
    "pedalboard>=0.9.24,<1",
    "pyrnnoise==0.4.3",
    "sounddevice>=0.5.3,<1",
    "soundfile>=0.12,<1",
    "wxPython>=4.2.3,<5",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.2"]
test = ["pytest>=8.3,<9"]

[project.scripts]
mini-mesa = "mini_mesa.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mini_mesa*"]

[tool.setuptools.package-data]
mini_mesa = [
    "assets/hrtf/mit_kemar/*.wav",
    "assets/hrtf/mit_kemar/NOTICE.txt",
    "assets/sounds/*.wav",
    "assets/sounds/NOTICE.txt",
]
